name: ai-log-analysis-demo

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: alad-postgres
    environment:
      POSTGRES_DB: ailogs
      POSTGRES_USER: ailogs
      POSTGRES_PASSWORD: ailogs_dev_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ailogs -d ailogs"]
      interval: 5s
      timeout: 3s
      retries: 20

  mock-llm:
    build:
      context: ./gateway/envoy-ai-gateway/upstream-mock
      dockerfile: Dockerfile
    container_name: alad-mock-llm
    profiles: ["mock"]   # 默认不启;`docker compose --profile mock up` 时启用
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  envoy-ai-gateway:
    image: envoyproxy/envoy:v1.32-latest
    container_name: alad-gateway
    volumes:
      - ./gateway/envoy-ai-gateway/config/envoy-deepseek.yaml.tmpl:/etc/envoy/envoy-deepseek.yaml.tmpl:ro
      - ./gateway/envoy-ai-gateway/config/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/entrypoint.sh"]
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      ENVOY_LOG_LEVEL: info
    ports:
      - "8090:8080"   # AI Gateway listener (host 8090 → container 8080)
      - "9901:9901"   # Envoy admin (demo only, never in prod)
    healthcheck:
      # envoy distroless 没有 wget/curl, 用 bash /dev/tcp 做 TCP 探针
      test: ["CMD", "bash", "-c", ": < /dev/tcp/localhost/9901"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Portkey OSS 网关 (可切换的第二个网关); 默认不启:
  #   docker compose --profile portkey up -d gateway-portkey
  #   并在 .env 设 GATEWAY_PROVIDER=portkey + 重启 backend
  gateway-portkey:
    image: portkeyai/gateway:latest
    container_name: alad-portkey
    profiles: ["portkey"]
    ports:
      - "8787:8787"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alad-backend
    volumes:
      # 测试要按这一份 schema 建测试库 (tests/conftest.py)。挂载而不是 COPY 进镜像:
      # 构建上下文是 ./backend, 够不到 ../infra; 而复制一份到 backend/ 下会和真实
      # 的表结构悄悄长歪。挂载让两边永远是同一个文件。
      - ./infra/postgres/init.sql:/app/infra/postgres/init.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
      envoy-ai-gateway:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://ailogs:ailogs_dev_only@postgres:5432/ailogs
      LLM_GATEWAY_URL: http://envoy-ai-gateway:8080
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY:-demo-key-not-secret}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      # 网关 provider 可切换: envoy (自建数据面) | portkey (托管控制面)
      # 这是启动默认值; 单次请求可用 ChatRequest.provider 覆盖 —— 演示要能当场切。
      GATEWAY_PROVIDER: ${GATEWAY_PROVIDER:-portkey}
      # Portkey 托管版。护栏 (可接 Prisma AIRS) 挂在 pc-/pg- 配置上, 命中回 446。
      PORTKEY_BASE_URL: ${PORTKEY_BASE_URL:-https://api.portkey.ai/v1}
      PORTKEY_API_KEY: ${PORTKEY_API_KEY:-}
      PORTKEY_CONFIG: ${PORTKEY_CONFIG:-}
      PORTKEY_GUARDRAIL: ${PORTKEY_GUARDRAIL:-}
      PORTKEY_VIRTUAL_KEY: ${PORTKEY_VIRTUAL_KEY:-}
      PORTKEY_ORG_ID: ${PORTKEY_ORG_ID:-}
      # 自建 OSS 版的地址 (走 OSS 路径时把 PORTKEY_BASE_URL 指到它)
      PORTKEY_URL: ${PORTKEY_URL:-http://gateway-portkey:8787}
      # portkey 路径下 backend 需自带 provider key 透传 (Envoy 路径不用)
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: backend
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      # Koi 供应链网关 (Pattern A); 默认关, .env 里开
      KOI_ENABLED: ${KOI_ENABLED:-false}
      KOI_API_BASE: ${KOI_API_BASE:-https://api.prod.koi.security/api/external/v2}
      KOI_API_KEY: ${KOI_API_KEY:-}
      KOI_AUTH_STYLE: ${KOI_AUTH_STYLE:-bearer}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alad-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Next.js 服务端 rewrites 读取,容器内部 DNS,不依赖宿主机 IP
      INTERNAL_BACKEND_URL: http://backend:8000
      # 登录凭证 — 必须在 .env 里配置, 没有默认值
      # 登录只要一个共享访问码; DEMO_PASSWORD 是旧名, 一起传下去不破坏已有 .env。
      # 没有默认值 —— 未配置时前端拒绝全部登录 (见 frontend/src/lib/session.ts)
      DEMO_ACCESS_CODE: ${DEMO_ACCESS_CODE:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      # 会话 cookie 签名密钥; 留空则从访问码派生 (见 frontend/src/lib/session.ts)
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  nginx-tls:
    image: nginx:1.27-alpine
    container_name: alad-nginx-tls
    profiles: ["tls"]   # 默认不启; `docker compose --profile tls up -d nginx-tls`
    depends_on:
      - frontend
    volumes:
      - ./infra/tls/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/tls/certs:/etc/nginx/certs:ro
    ports:
      - "443:443"
      - "8443:80"   # http->https 跳转 (80 给 milos 留着, 用 8443)

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.0
    container_name: alad-otel
    profiles: ["observability"]   # 默认不启;`docker compose --profile observability up`
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    command: ["--config", "/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

volumes:
  postgres_data:
