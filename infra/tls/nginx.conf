# .210 内网 HTTPS 终结 — vibe-coding.demo.local 自签证书 -> 代理 frontend:3000
# 本机 hosts: <host-ip>  vibe-coding.demo.local

server {
    listen 80;
    server_name vibe-coding.demo.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name vibe-coding.demo.local;

    ssl_certificate     /etc/nginx/certs/demo.crt;
    ssl_certificate_key /etc/nginx/certs/demo.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 日志上传可达 50MB (与后端 max_upload_bytes 一致)
    client_max_body_size 50m;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
