receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
  attributes/llm-redact:
    actions:
      - key: prompt.text
        action: hash
      - key: response.text
        action: hash

exporters:
  debug:
    verbosity: detailed
  file:
    path: /var/log/otel-spans.jsonl

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/llm-redact, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
